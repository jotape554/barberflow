# Pode ser sobrescrito por variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberpro_saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defina JWT_SECRET com uma chave longa e secreta em produção (nunca commitar a real)
jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-string-bem-longa-e-secreta-em-producao-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}

# Stripe — nunca commitar valores reais. Chave/segredo de teste ficam só em variáveis de ambiente.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.basico=${STRIPE_PRICE_BASICO:}
stripe.price.profissional=${STRIPE_PRICE_PROFISSIONAL:}
stripe.price.premium=${STRIPE_PRICE_PREMIUM:}

# URL do frontend, para onde a Stripe redireciona após o checkout
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# E-mail (recuperação de senha). Sem MAIL_USERNAME configurado, o envio é só simulado
# (fica no log) — útil em desenvolvimento antes de configurar uma conta de verdade.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
