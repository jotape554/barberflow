# Pode ser sobrescrito por variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barberpro_saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defina JWT_SECRET com uma chave longa e secreta em produção (nunca commitar a real)
jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-string-bem-longa-e-secreta-em-producao-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
