name: Backup do banco de dados

on:
  schedule:
    - cron: '0 6 * * *' # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, pra testar

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar o dump do banco
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:latest \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom' > backup.dump

      - name: Criptografar o backup
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump -out "backup-$(date +%Y-%m-%d).dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm backup.dump

      - name: Guardar o backup criptografado
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco-${{ github.run_id }}
          path: backup-*.dump.enc
          retention-days: 30
